# 租约默认存活时间（毫秒）
lease.default-ttl-millis=10000
# 本地持久化数据目录（租约记录 / 幂等记录 / 写入台账）
lease.data-dir=./data/leases
# 续约链路超时（毫秒），超过则归一化为 TEMPORARILY_UNAVAILABLE(503)
lease.renew-timeout-millis=2000
# 到期回收扫描间隔（毫秒）
lease.reap-interval-millis=2000

logging.level.com.github.h3yow.fencingleasecoordinatorjava=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
